# ============================================================
# ChabahRoot - Fichier de configuration des règles
# Module : Analyste Cyber (Moteur logique et modes)
# ============================================================

# --- Mots-clés sensibles à filtrer (séparés par des espaces) ---
SENSITIVE_KEYWORDS="pass password token secret key"

# --- Chemin du fichier de log principal ---
LOG_FILE="./logs/chabah.log"

# --- Niveau de log : DEBUG | INFO | WARN | ALERT ---
LOG_LEVEL="INFO"

# --- UID cible de détection (0 = root) ---
TARGET_UID=0

# --- Activer le mode offensif (1 = oui, 0 = non) ---
OFFENSIVE_MODE=1

# --- Activer le mode défensif (1 = oui, 0 = non) ---
DEFENSIVE_MODE=1

# --- Durée de surveillance en secondes (0 = infini) ---
WATCH_DURATION=0

# --- Intervalle de polling en secondes ---
POLL_INTERVAL=2

# --- Nom du projet ---
PROJECT_NAME="ChabahRoot"
MODULE_NAME="Analyste Cyber"
VERSION="1.0.0"
