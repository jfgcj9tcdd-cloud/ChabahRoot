# Configuration de detection ChabahRoot

# Mots sensibles utilises pour le filtrage ou l alerte
SENSITIVE_KEYWORDS="pass password token secret key"

# Chemin du journal principal
LOG_FILE="./logs/chabah.log"

# Niveau de journalisation : DEBUG | INFO | WARN | ALERT
LOG_LEVEL="INFO"

# UID cible pour la detection (0 = root)
TARGET_UID=0

# Activation des modes de detection
OFFENSIVE_MODE=1
DEFENSIVE_MODE=1

# Duree de surveillance en secondes (0 = infini)
WATCH_DURATION=0

# Intervalle de scrutation en secondes
POLL_INTERVAL=2

# Metadonnees du projet
PROJECT_NAME="ChabahRoot"
MODULE_NAME="Detection Engine"
VERSION="1.0.0"
