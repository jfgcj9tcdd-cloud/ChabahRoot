# ============================================================
# ChabahRoot Detection Configuration
# ============================================================

# Sensitive keywords to filter/alert on (space-separated)
SENSITIVE_KEYWORDS="pass password token secret key"

# Log file path
LOG_FILE="./logs/chabah.log"

# Log level: DEBUG | INFO | WARN | ALERT
LOG_LEVEL="INFO"

# Target UID for detection (0 = root)
TARGET_UID=0

# Enable/disable detection modes
OFFENSIVE_MODE=1
DEFENSIVE_MODE=1

# Surveillance duration in seconds (0 = infinite)
WATCH_DURATION=0

# Polling interval in seconds
POLL_INTERVAL=2

# Project metadata
PROJECT_NAME="ChabahRoot"
MODULE_NAME="Detection Engine"
VERSION="1.0.0"
